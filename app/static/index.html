<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messenger</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f0f2f5; color: #1c1e21; height: 100vh; }
    button { cursor: pointer; padding: .45rem .9rem; border: 0; border-radius: 6px; background: #0b6bcb; color: #fff; font: inherit; }
    button.secondary { background: #e4e6eb; color: #1c1e21; }
    input, select { padding: .45rem; border: 1px solid #ccd0d5; border-radius: 6px; font: inherit; }
    .hidden { display: none !important; }
    .error { color: #c0392b; font-size: .9rem; min-height: 1.2rem; margin: .4rem 0 0; }

    #login { max-width: 360px; margin: 10vh auto; background: #fff; padding: 1.5rem; border-radius: 10px; }
    #login h1 { margin-top: 0; }
    #login form { display: flex; flex-direction: column; gap: .6rem; }
    #login .tabs { display: flex; gap: .5rem; margin-bottom: 1rem; }
    #login .tabs button { flex: 1; }

    #app { display: flex; height: 100vh; }
    #sidebar { width: 300px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
    #sidebar header { padding: .75rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; }
    #search-form { display: flex; gap: .4rem; padding: .6rem .75rem; }
    #search-form input { flex: 1; min-width: 0; }
    #conv-list { flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 0; }
    #conv-list li { padding: .7rem .75rem; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
    #conv-list li:hover { background: #f5f6f7; }
    #conv-list li.active { background: #e7f0fb; }
    #conv-list small { color: #65676b; display: block; }
    #new-conv { padding: .75rem; border-top: 1px solid #eee; }
    #new-conv summary { cursor: pointer; }
    #participants { max-height: 140px; overflow-y: auto; margin: .5rem 0; }
    #participants label { display: block; }
    #new-conv input[type=text] { width: 100%; margin-bottom: .4rem; }

    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #chat-title { padding: .85rem 1rem; background: #fff; border-bottom: 1px solid #ddd; font-weight: 600; }
    #messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .5rem; }
    .msg { max-width: 70%; padding: .5rem .75rem; border-radius: 12px; background: #fff; overflow-wrap: anywhere; }
    .msg.mine { align-self: flex-end; background: #cfe5ff; }
    .msg .who { font-size: .8rem; color: #65676b; }
    .msg time { display: block; font-size: .7rem; color: #65676b; text-align: right; }
    .msg.found { cursor: pointer; align-self: stretch; max-width: none; }
    .placeholder { margin: auto; color: #65676b; }
    #send-form { display: flex; gap: .5rem; padding: .75rem; background: #fff; border-top: 1px solid #ddd; }
    #send-form input { flex: 1; }
    #chat-error { padding: 0 1rem .5rem; background: #fff; margin: 0; }

    @media (max-width: 640px) {
      #app { flex-direction: column; }
      #sidebar { width: 100%; height: 45vh; border-right: 0; border-bottom: 1px solid #ddd; }
    }
  </style>
</head>
<body>
  <section id="login">
    <h1>Messenger</h1>
    <div class="tabs">
      <button type="button" id="tab-login">Вхід</button>
      <button type="button" id="tab-register" class="secondary">Реєстрація</button>
    </div>
    <form id="login-form">
      <input id="login-tag" placeholder="Ваш тег" maxlength="33" autocomplete="username" required>
      <input id="login-password" type="password" placeholder="Пароль" autocomplete="current-password" required>
      <button>Увійти</button>
    </form>
    <form id="register-form" class="hidden">
      <input id="reg-name" placeholder="Ім'я" maxlength="32" autocomplete="off" required>
      <input id="reg-tag" placeholder="Тег (латиниця, цифри, _), напр. artem_k" maxlength="33" autocomplete="off" required>
      <input id="reg-password" type="password" placeholder="Пароль (від 6 символів)" autocomplete="new-password" required>
      <input id="reg-password2" type="password" placeholder="Повторіть пароль" autocomplete="new-password" required>
      <button>Зареєструватися</button>
    </form>
    <p class="error" id="login-error"></p>
  </section>

  <div id="app" class="hidden">
    <aside id="sidebar">
      <header>
        <strong id="me"></strong>
        <button id="logout" class="secondary">Вийти</button>
      </header>
      <form id="search-form">
        <input id="search-q" placeholder="Пошук повідомлень" autocomplete="off">
        <button>Знайти</button>
      </form>
      <ul id="conv-list"></ul>
      <details id="new-conv">
        <summary>Нова розмова</summary>
        <div id="participants"></div>
        <input type="text" id="conv-title" placeholder="Назва (для групи, необов'язково)">
        <button id="create-conv">Створити</button>
        <p class="error" id="conv-error"></p>
      </details>
    </aside>

    <main id="main">
      <div id="chat-title">Оберіть розмову</div>
      <div id="messages"><div class="placeholder">Оберіть розмову зліва</div></div>
      <p class="error" id="chat-error"></p>
      <form id="send-form" class="hidden">
        <input id="text" placeholder="Повідомлення..." maxlength="2000" autocomplete="off" required>
        <button>Надіслати</button>
      </form>
    </main>
  </div>

  <script>
    const POLL_MS = 3000;
    const $ = (id) => document.getElementById(id);
    const state = { me: null, users: [], convs: [], current: null, searchMode: false };
    let pollTimer = null;
    let historyRequest = 0;

    async function api(method, path, body) {
      let res;
      try {
        res = await fetch("/api" + path, {
          method,
          headers: body ? { "Content-Type": "application/json" } : undefined,
          body: body ? JSON.stringify(body) : undefined,
        });
      } catch {
        throw new Error("Немає зв'язку із сервером");
      }
      const data = await res.json().catch(() => null);
      if (!res.ok) {
        const d = data && data.detail;
        throw new Error(typeof d === "string" ? d : "Некоректний запит");
      }
      return data;
    }

    const userName = (id) => (state.users.find((u) => u.id === id) || {}).username || "?";
    const fmtTime = (iso) => new Date(iso).toLocaleString("uk-UA", {
      day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit",
    });
    function convTitle(c) {
      if (c.title) return c.title;
      const others = c.participants.filter((id) => id !== state.me.id).map(userName);
      return others.join(", ") || "Розмова";
    }

    // ---- login ----
    async function loadUsers() {
      state.users = await api("GET", "/users");
    }

    async function enter(user) {
      state.me = user;
      $("login").classList.add("hidden");
      $("app").classList.remove("hidden");
      $("me").textContent = `${user.username} (@${user.tag})`;
      await loadUsers();
      await refreshConvs();
      renderParticipants();
      pollTimer = setInterval(tick, POLL_MS);
    }

    function showTab(registering) {
      $("login-form").classList.toggle("hidden", registering);
      $("register-form").classList.toggle("hidden", !registering);
      $("tab-login").classList.toggle("secondary", registering);
      $("tab-register").classList.toggle("secondary", !registering);
      $("login-error").textContent = "";
    }
    $("tab-login").onclick = () => showTab(false);
    $("tab-register").onclick = () => showTab(true);

    $("login-form").onsubmit = async (e) => {
      e.preventDefault();
      $("login-error").textContent = "";
      try {
        const u = await api("POST", "/login", {
          tag: $("login-tag").value,
          password: $("login-password").value,
        });
        $("login-password").value = "";
        await enter(u);
      } catch (err) {
        $("login-error").textContent = err.message;
      }
    };

    $("register-form").onsubmit = async (e) => {
      e.preventDefault();
      $("login-error").textContent = "";
      const password = $("reg-password").value;
      if (password !== $("reg-password2").value) {
        $("login-error").textContent = "Паролі не збігаються";
        return;
      }
      try {
        const u = await api("POST", "/users", {
          username: $("reg-name").value.trim(),
          tag: $("reg-tag").value,
          password,
          password_repeat: $("reg-password2").value,
        });
        $("register-form").reset();
        await enter(u);
      } catch (err) {
        $("login-error").textContent = err.message;
      }
    };

    $("logout").onclick = () => {
      clearInterval(pollTimer);
      showTab(false);
      Object.assign(state, { me: null, convs: [], current: null, searchMode: false });
      $("app").classList.add("hidden");
      $("login").classList.remove("hidden");
      resetChat();
    };

    // ---- conversations ----
    async function refreshConvs() {
      state.convs = await api("GET", "/conversations?user_id=" + encodeURIComponent(state.me.id));
      renderConvs();
    }

    function renderConvs() {
      const list = $("conv-list");
      list.replaceChildren(...state.convs.map((c) => {
        const li = document.createElement("li");
        if (state.current && state.current.id === c.id) li.className = "active";
        const t = document.createElement("strong");
        t.textContent = convTitle(c);
        const s = document.createElement("small");
        s.textContent = c.participants.length > 2 ? `Група, ${c.participants.length} учасників` : "Особистий чат";
        li.append(t, s);
        li.onclick = () => openConv(c);
        return li;
      }));
      if (!state.convs.length) {
        const li = document.createElement("li");
        li.textContent = "Розмов поки немає";
        li.style.cursor = "default";
        list.append(li);
      }
    }

    function renderParticipants() {
      const box = $("participants");
      box.replaceChildren(...state.users.filter((u) => u.id !== state.me.id).map((u) => {
        const label = document.createElement("label");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.value = u.id;
        label.append(cb, ` ${u.username} (@${u.tag || "—"})`);
        return label;
      }));
    }

    $("new-conv").addEventListener("toggle", async () => {
      if (!$("new-conv").open) return;
      try {
        state.users = await api("GET", "/users");
        renderParticipants();
      } catch (err) {
        $("conv-error").textContent = err.message;
      }
    });

    $("create-conv").onclick = async () => {
      $("conv-error").textContent = "";
      const ids = [...$("participants").querySelectorAll("input:checked")].map((cb) => cb.value);
      const title = $("conv-title").value.trim();
      try {
        const c = await api("POST", "/conversations", {
          participant_ids: [state.me.id, ...ids],
          title: title || null,
        });
        $("conv-title").value = "";
        $("participants").querySelectorAll("input").forEach((cb) => { cb.checked = false; });
        $("new-conv").open = false;
        await refreshConvs();
        openConv(c);
      } catch (err) {
        $("conv-error").textContent = err.message;
      }
    };

    // ---- chat ----
    function resetChat() {
      $("chat-title").textContent = "Оберіть розмову";
      $("messages").replaceChildren(placeholder("Оберіть розмову зліва"));
      $("send-form").classList.add("hidden");
      $("chat-error").textContent = "";
    }

    function placeholder(text) {
      const d = document.createElement("div");
      d.className = "placeholder";
      d.textContent = text;
      return d;
    }

    function msgNode(m, withChat) {
      const div = document.createElement("div");
      div.className = "msg" + (m.sender_id === state.me.id ? " mine" : "");
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = userName(m.sender_id);
      const text = document.createElement("div");
      text.textContent = m.text;
      const time = document.createElement("time");
      time.dateTime = m.created_at;
      time.textContent = fmtTime(m.created_at);
      div.append(who, text, time);
      if (withChat) {
        const c = state.convs.find((x) => x.id === m.conversation_id);
        if (c) who.textContent += " · " + convTitle(c);
      }
      return div;
    }

    async function openConv(c) {
      state.current = c;
      state.searchMode = false;
      $("chat-title").textContent = convTitle(c);
      $("send-form").classList.remove("hidden");
      $("chat-error").textContent = "";
      renderConvs();
      await loadHistory(true);
      $("text").focus();
    }

    async function loadHistory(forceScroll) {
      if (!state.current || state.searchMode) return;
      const id = state.current.id;
      const req = ++historyRequest;
      let msgs;
      try {
        msgs = await api("GET", `/conversations/${id}/messages`);
      } catch (err) {
        $("chat-error").textContent = err.message;
        return;
      }
      if (req !== historyRequest || !state.current || state.current.id !== id || state.searchMode) return;
      $("chat-error").textContent = "";
      const box = $("messages");
      const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
      box.replaceChildren(...(msgs.length ? msgs.map((m) => msgNode(m, false)) : [placeholder("Повідомлень ще немає")]));
      if (forceScroll || atBottom) box.scrollTop = box.scrollHeight;
    }

    $("send-form").onsubmit = async (e) => {
      e.preventDefault();
      if (!state.current) return;
      const input = $("text");
      const text = input.value;
      try {
        await api("POST", `/conversations/${state.current.id}/messages`, { sender_id: state.me.id, text });
        input.value = "";
        $("chat-error").textContent = "";
        await loadHistory(true);
      } catch (err) {
        $("chat-error").textContent = err.message;
      }
    };

    // ---- search ----
    $("search-form").onsubmit = async (e) => {
      e.preventDefault();
      const q = $("search-q").value.trim();
      if (!q) {
        state.searchMode = false;
        if (state.current) openConv(state.current); else resetChat();
        return;
      }
      try {
        const found = await api("GET", `/search?q=${encodeURIComponent(q)}&user_id=${encodeURIComponent(state.me.id)}`);
        state.searchMode = true;
        $("chat-title").textContent = `Результати пошуку: «${q}» (${found.length})`;
        $("send-form").classList.add("hidden");
        $("chat-error").textContent = "";
        const box = $("messages");
        box.replaceChildren(...(found.length ? found.map((m) => {
          const n = msgNode(m, true);
          n.classList.add("found");
          n.onclick = () => {
            const c = state.convs.find((x) => x.id === m.conversation_id);
            if (c) openConv(c);
          };
          return n;
        }) : [placeholder("Нічого не знайдено")]));
      } catch (err) {
        $("chat-error").textContent = err.message;
      }
    };

    // ---- polling ----
    async function tick() {
      try {
        const before = state.convs.length;
        await refreshConvs();
        if (state.convs.length !== before) state.users = await api("GET", "/users");
        await loadHistory(false);
      } catch (err) {
        $("chat-error").textContent = err.message;
      }
    }

  </script>
</body>
</html>
