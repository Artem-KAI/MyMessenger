<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messenger</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    #log { border: 1px solid #ccc; height: 320px; overflow-y: auto; padding: .5rem; margin-bottom: .5rem; }
    form { display: flex; gap: .5rem; }
    input { flex: 1; padding: .4rem; }
  </style>
</head>
<body>
  <h1>Messenger</h1>
  <div id="log"></div>
  <form id="form">
    <input id="msg" autocomplete="off" placeholder="Повідомлення..." required>
    <button>Надіслати</button>
  </form>
  <script>
    const name = prompt("Ваше ім'я:") || "anon";
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}/ws/${encodeURIComponent(name)}`);
    const log = document.getElementById("log");
    ws.onmessage = (e) => {
      const p = document.createElement("div");
      p.textContent = e.data;
      log.appendChild(p);
      log.scrollTop = log.scrollHeight;
    };
    document.getElementById("form").onsubmit = (e) => {
      e.preventDefault();
      const input = document.getElementById("msg");
      ws.send(input.value);
      input.value = "";
    };
  </script>
</body>
</html>
